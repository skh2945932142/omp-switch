name: OMP schema watch

# Weekly canary: detects unsupported majors and schema-source drift within supported majors.
on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check upstream OMP schema support
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Compare upstream release and pinned schema sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-omp-version.mjs

      - name: Open a tracking issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "OMP upstream schema changed — compatibility review needed" \
            --body "The weekly schema watch detected either an unsupported Oh My Pi major or drift in a pinned schema/config source. Do not expand the writable set automatically. Review the failed run, scripts/omp-schema-baseline.json, schema.ts, validation.ts, catalog.ts, and tests before updating compatibility documentation." \
            --label "maintenance" || true
