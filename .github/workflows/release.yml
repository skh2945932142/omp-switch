name: Release Draft

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    name: Build and attest Windows assets
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version $version"
          }
          if (-not (Test-Path "docs/releases/${{ github.ref_name }}.md")) {
            throw "Missing docs/releases/${{ github.ref_name }}.md"
          }

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@2016bd2012dba4e32de620c46fe006a3ac9f0602 # v5.0.1
        with:
          dotnet-version: 10.0.x

      - name: Enable Corepack
        shell: pwsh
        run: corepack enable

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Verify source
        shell: pwsh
        run: |
          pnpm typecheck
          pnpm test

      - name: Package Windows artifacts
        shell: pwsh
        run: pnpm package:win

      - name: Verify packaged JSON CLI
        shell: pwsh
        run: pnpm verify:package-cli

      - name: Generate checksums
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $assets = @(Get-ChildItem -Path dist -File | Where-Object { $_.Extension -in ".exe", ".zip" -and $_.Name -like "*$version*" } | Sort-Object Name)
          if ($assets.Count -ne 2) {
            throw "Expected exactly the installer executable and portable ZIP in dist/"
          }
          $lines = foreach ($asset in $assets) {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 -LiteralPath $asset.FullName).Hash.ToLowerInvariant(), $asset.Name
          }
          # LF and no BOM: WriteAllLines would use CRLF, which makes `sha256sum -c` fail on every
          # line even when the names and hashes are right.
          $text = ($lines -join "`n") + "`n"
          [System.IO.File]::WriteAllText((Join-Path $PWD "dist/SHA256SUMS.txt"), $text, [System.Text.UTF8Encoding]::new($false))

      - name: Attest installer provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*.exe

      - name: Attest portable archive provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*.zip

      - name: Upload release assets
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-assets
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt

  build-linux:
    name: Build and attest Linux assets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chromium initializes the UI platform layer before app code (see ci.yml verify-linux).
      - name: Install Electron runtime libraries and xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2
      - name: Package Linux artifacts
        run: pnpm package:linux

      - name: Smoke-test the unpacked binary
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          mkdir -p "$root/home/.omp/agent" "$root/data"
          cat > "$root/home/.omp/agent/models.yml" <<'YML'
          providers:
            demo:
              baseUrl: https://api.example.test/v1
              api: openai-completions
              auth: none
              models:
                - id: demo-1
          YML
          HOME="$root/home" OMP_SWITCH_DATA_DIR="$root/data" \
          HOME="$root/home" OMP_SWITCH_DATA_DIR="$root/data" \
            xvfb-run -a "dist/linux-unpacked/omp-switch" --no-sandbox --json list 2>pkg-smoke.err | grep -q '"ok":true' || { cat pkg-smoke.err >&2; exit 1; }
          HOME="$root/home" OMP_SWITCH_DATA_DIR="$root/data" \
          HOME="$root/home" OMP_SWITCH_DATA_DIR="$root/data" \
            xvfb-run -a dist/linux-unpacked/omp-switch-cli --json list 2>pkg-smoke.err | grep -q '"ok":true' || { cat pkg-smoke.err >&2; exit 1; }

      - name: Attest Linux artifact provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*.AppImage
            dist/*.deb

      - name: Upload Linux release assets
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-assets-linux
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb

  draft-release:
    name: Create release draft
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Download Windows release assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-assets
          path: release-assets

      - name: Download Linux release assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-assets-linux
          path: release-assets

      # One SHA256SUMS.txt covering both platforms: the Windows job writes its own copy into its
      # artifact; regenerate here over everything so the published file is the complete manifest.
      - name: Regenerate checksums over all assets
        run: |
          set -euo pipefail
          cd release-assets
          find . -maxdepth 1 -type f ! -name "SHA256SUMS.txt" -print0 | sort -z |
          xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate and sign the update manifest
        env:
          # Ed25519 private key (PKCS8 DER, base64). Its public counterpart is hardcoded in the app
          # (packages/core/src/update.ts VERIFY_PUBLIC_KEY) and verifies every manifest the app fetches.
          # Required: without it the release still publishes, but the manifest/signature assets are
          # skipped and the in-app update checker will report "no manifest" until a later release ships.
          SIGNING_KEY: ${{ secrets.OMP_UPDATE_ED25519 }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          repo="${GITHUB_REPOSITORY:-skh2945932142/omp-switch}"
          release_url="https://github.com/${repo}/releases/tag/${TAG_NAME}"
          # Pull a short summary from the release notes (the first Added/Fixed bullet), so the
          # in-app "关于" drawer can show what changed without the user opening the browser.
          summary="$(awk '/^## (Added|Fixed)/{f=1;next} f && /^- /{gsub(/^- /,"");print;exit}' "docs/releases/${TAG_NAME}.md" | head -c 280)"
          cat > latest.json <<JSON
          {"version":1,"name":"OMP Switch","release":"${version}","url":"${release_url}","summary":"${summary}","publishedAt":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          JSON
          if [ -z "${SIGNING_KEY}" ]; then
            echo "::warning::OMP_UPDATE_ED25519 secret is not set; skipping manifest signing. The in-app update checker will see no signed manifest for this release."
            exit 0
          fi
          node -e '
            const crypto = require("crypto");
            const fs = require("fs");
            const privKey = crypto.createPrivateKey({
              key: Buffer.from(process.env.SIGNING_KEY, "base64"),
              format: "der",
              type: "pkcs8",
            });
            const data = fs.readFileSync("latest.json");
            const sig = crypto.sign(null, data, privKey).toString("base64");
            fs.writeFileSync("latest.json.sig", sig);
          '
          # Verify the signature against the app's hardcoded public key before publishing, so a
          # mismatched key fails the release rather than shipping an unverifiable manifest.
          node -e '
            const crypto = require("crypto");
            const fs = require("fs");
            const PUB = "6BinnnFiq6WYtVR2LXd6XWUIQHUgIiFvcGUyIlyXFcc=";
            const prefix = Buffer.from([0x30,0x2a,0x30,0x05,0x06,0x03,0x2b,0x65,0x70,0x03,0x21,0x00]);
            const key = crypto.createPublicKey({ key: Buffer.concat([prefix, Buffer.from(PUB, "base64")]), format: "der", type: "spki" });
            const data = fs.readFileSync("latest.json");
            const sig = Buffer.from(fs.readFileSync("latest.json.sig", "utf8").trim(), "base64");
            if (!crypto.verify(null, data, key, sig)) { console.error("manifest signature does not verify against the app public key"); process.exit(1); }
            console.log("manifest signature verified");
          '

      - name: Create GitHub Release draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" release-assets/* \
            --draft \
            --verify-tag \
            --title "OMP Switch $TAG_NAME" \
            --notes-file "docs/releases/$TAG_NAME.md"
          # Attach the signed manifest (if it was produced) to the same release. It is served from
          # /releases/download/latest/ so the app's fixed URL always points at the newest manifest.
          if [ -f latest.json ]; then
            gh release upload "$TAG_NAME" latest.json latest.json.sig --clobber
          fi

  publish-cli-image:
    name: Publish the headless CLI image to GHCR
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Pushed as :<version> and :latest so `docker pull` is a real install method rather than
      # "clone the repository and build it yourself".
      - name: Build, smoke-test and push
        env:
          TAG_NAME: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          image="ghcr.io/${OWNER,,}/omp-switch-cli"
          docker build -t "$image:$version" -t "$image:latest" .

          # Exercise the exact image that is about to be pushed, not a rebuild of it.
          root="$(mktemp -d)"
          mkdir -p "$root/.omp/agent"
          cat > "$root/.omp/agent/models.yml" <<'YML'
          providers:
            demo:
              baseUrl: https://api.example.test/v1
              api: openai-completions
              auth: none
              models:
                - id: demo-1
          YML
          docker run --rm --user "$(id -u):$(id -g)" -v "$root/.omp:/home/node/.omp" \
            "$image:$version" validate --profile default | tee /dev/stderr | grep -q '"ok":true'

          docker push "$image:$version"
          docker push "$image:latest"
