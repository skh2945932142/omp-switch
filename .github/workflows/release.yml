name: Release Draft

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    name: Build and attest Windows assets
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version $version"
          }
          if (-not (Test-Path "docs/releases/${{ github.ref_name }}.md")) {
            throw "Missing docs/releases/${{ github.ref_name }}.md"
          }

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@2016bd2012dba4e32de620c46fe006a3ac9f0602 # v5.0.1
        with:
          dotnet-version: 10.0.x

      - name: Enable Corepack
        shell: pwsh
        run: corepack enable

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Verify source
        shell: pwsh
        run: |
          pnpm typecheck
          pnpm test

      - name: Package Windows artifacts
        shell: pwsh
        run: pnpm package:win

      - name: Verify packaged JSON CLI
        shell: pwsh
        run: pnpm verify:package-cli

      - name: Generate checksums
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem -Path dist -File | Where-Object { $_.Extension -in ".exe", ".zip" } | Sort-Object Name)
          if ($assets.Count -ne 2) {
            throw "Expected exactly the installer executable and portable ZIP in dist/"
          }
          $lines = foreach ($asset in $assets) {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 -LiteralPath $asset.FullName).Hash.ToLowerInvariant(), $asset.Name
          }
          [System.IO.File]::WriteAllLines((Join-Path $PWD "dist/SHA256SUMS.txt"), [string[]]$lines, [System.Text.UTF8Encoding]::new($false))

      - name: Attest installer provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*.exe

      - name: Attest portable archive provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*.zip

      - name: Upload release assets
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-assets
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt

  draft-release:
    name: Create release draft
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Download release assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-assets
          path: release-assets

      - name: Create GitHub Release draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" release-assets/* \
            --draft \
            --verify-tag \
            --title "OMP Switch $TAG_NAME" \
            --notes-file "docs/releases/$TAG_NAME.md"
