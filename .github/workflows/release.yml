name: Release Draft

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    name: Build and attest Windows assets
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version $version"
          }
          if (-not (Test-Path "docs/releases/${{ github.ref_name }}.md")) {
            throw "Missing docs/releases/${{ github.ref_name }}.md"
          }

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@2016bd2012dba4e32de620c46fe006a3ac9f0602 # v5.0.1
        with:
          dotnet-version: 10.0.x

      - name: Enable Corepack
        shell: pwsh
        run: corepack enable

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Verify source
        shell: pwsh
        run: |
          pnpm typecheck
          pnpm test

      - name: Package Windows artifacts
        shell: pwsh
        run: pnpm package:win

      - name: Verify packaged JSON CLI
        shell: pwsh
        run: pnpm verify:package-cli

      - name: Generate checksums
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $assets = @(Get-ChildItem -Path dist -File | Where-Object { $_.Extension -in ".exe", ".zip" -and $_.Name -like "*$version*" } | Sort-Object Name)
          if ($assets.Count -ne 2) {
            throw "Expected exactly the installer executable and portable ZIP in dist/"
          }
          $lines = foreach ($asset in $assets) {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 -LiteralPath $asset.FullName).Hash.ToLowerInvariant(), $asset.Name
          }
          # LF and no BOM: WriteAllLines would use CRLF, which makes `sha256sum -c` fail on every
          # line even when the names and hashes are right.
          $text = ($lines -join "`n") + "`n"
          [System.IO.File]::WriteAllText((Join-Path $PWD "dist/SHA256SUMS.txt"), $text, [System.Text.UTF8Encoding]::new($false))

      - name: Attest installer provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*.exe

      - name: Attest portable archive provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*.zip

      - name: Upload release assets
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-assets
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt

  draft-release:
    name: Create release draft
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Download release assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-assets
          path: release-assets

      # The Scoop bucket is served from this repository, so its manifest carries a literal hash of
      # the portable ZIP. electron-builder output is not reproducible, so any rebuild — including a
      # re-tag — changes that hash and would leave `scoop install` failing verification. Fail here
      # rather than publishing a bucket that does not match the assets.
      - name: Check the Scoop bucket matches the built assets
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          expected="$(awk '/-win\.zip$/ {print $1}' release-assets/SHA256SUMS.txt)"
          actual="$(node -p "require('./bucket/omp-switch.json').architecture['64bit'].hash")"
          bucket_version="$(node -p "require('./bucket/omp-switch.json').version")"
          if [ "$bucket_version" != "$version" ] || [ "$actual" != "$expected" ]; then
            echo "bucket/omp-switch.json is stale."
            echo "  version : $bucket_version (expected $version)"
            echo "  hash    : $actual"
            echo "  built   : $expected"
            echo
            echo "Update it with 'pnpm render:packaging -Source <dir with the built assets>',"
            echo "commit the result, then move the tag. Publishing now would ship a Scoop"
            echo "manifest whose hash check fails for every user."
            exit 1
          fi
          echo "Scoop bucket matches the built portable ZIP."

      - name: Create GitHub Release draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" release-assets/* \
            --draft \
            --verify-tag \
            --title "OMP Switch $TAG_NAME" \
            --notes-file "docs/releases/$TAG_NAME.md"

  publish-cli-image:
    name: Publish the headless CLI image to GHCR
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Pushed as :<version> and :latest so `docker pull` is a real install method rather than
      # "clone the repository and build it yourself".
      - name: Build, smoke-test and push
        env:
          TAG_NAME: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          image="ghcr.io/${OWNER,,}/omp-switch-cli"
          docker build -t "$image:$version" -t "$image:latest" .

          # Exercise the exact image that is about to be pushed, not a rebuild of it.
          root="$(mktemp -d)"
          mkdir -p "$root/.omp/agent"
          cat > "$root/.omp/agent/models.yml" <<'YML'
          providers:
            demo:
              baseUrl: https://api.example.test/v1
              api: openai-completions
              auth: none
              models:
                - id: demo-1
          YML
          docker run --rm --user "$(id -u):$(id -g)" -v "$root/.omp:/home/node/.omp" \
            "$image:$version" validate --profile default | tee /dev/stderr | grep -q '"ok":true'

          docker push "$image:$version"
          docker push "$image:latest"
