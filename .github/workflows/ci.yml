name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify Windows build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@2016bd2012dba4e32de620c46fe006a3ac9f0602 # v5.0.1
        with:
          dotnet-version: 10.0.x

      - name: Enable Corepack
        shell: pwsh
        run: corepack enable

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        shell: pwsh
        run: pnpm typecheck

      - name: Test
        shell: pwsh
        run: pnpm test

      - name: Build
        shell: pwsh
        run: pnpm build

      - name: Ensure builds leave no source changes
        shell: pwsh
        run: |
          $changes = git status --porcelain --untracked-files=all
          if ($changes) {
            $changes
            throw "Build created tracked or unignored files. Update .gitignore or the build process."
          }

  cli:
    name: Verify headless CLI on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The CLI and packages/core must stay free of Windows-only and Electron-only code. Running the
      # suite and the built binary on Linux is what actually holds that line.
      - name: Test
        run: pnpm test

      - name: Build CLI
        run: pnpm build:cli

      - name: Smoke-test the CLI against a throwaway HOME
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          mkdir -p "$root/home/.omp/agent" "$root/data"
          cat > "$root/home/.omp/agent/models.yml" <<'YML'
          # comment must survive the round trip
          providers:
            demo:
              baseUrl: https://api.example.test/v1
              api: openai-completions
              auth: none
              models:
                - id: demo-1
          YML
          export HOME="$root/home" OMP_SWITCH_DATA_DIR="$root/data"
          cli="node $PWD/packages/cli/dist/main.js"

          $cli list | tee /dev/stderr | grep -q '"ok":true'
          $cli validate --profile default | grep -q '"ok":true'
          $cli apply --profile default --patch '{"roleAssignments":{"default":"demo/demo-1"}}' > /dev/null
          grep -q 'default: demo/demo-1' "$root/home/.omp/agent/config.yml"
          grep -q 'comment must survive' "$root/home/.omp/agent/models.yml"
          test -d "$root/data/snapshots/default"

          # Usage errors must not pollute stdout.
          if out="$($cli bogus 2>/dev/null)"; then echo "expected failure"; exit 1; fi
          test -z "${out:-}"
          echo "CLI smoke test passed"

      - name: Build TUI
        run: pnpm build:tui

      - name: Smoke-test the TUI (non-interactive modes + TTY guard)
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          mkdir -p "$root/home/.omp/agent"
          cat > "$root/home/.omp/agent/models.yml" <<'YML'
          providers:
            demo:
              baseUrl: https://api.example.test/v1
              api: openai-completions
              auth: none
              models:
                - id: demo-1
          YML
          tui="node $PWD/packages/tui/dist/main.js"
          HOME="$root/home" OMP_SWITCH_DATA_DIR="$root/data" $tui --help 2>&1 | grep -q "omp-switch-tui"
          HOME="$root/home" OMP_SWITCH_DATA_DIR="$root/data" $tui list 2>/dev/null | grep -q '"ok":true'
          HOME="$root/home" OMP_SWITCH_DATA_DIR="$root/data" $tui validate --profile default 2>/dev/null | grep -q '"ok":true'
          # Piped stdin must not hang waiting for a TTY.
          if echo | HOME="$root/home" $tui 2>/dev/null; then echo "expected TTY guard to fail"; exit 1; fi
          echo "TUI smoke test passed"

  docker:
    name: Build and smoke-test the Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build image
        run: docker build -t omp-switch-cli:ci .

      - name: Run against a mounted config directory
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          mkdir -p "$root/.omp/agent"
          cat > "$root/.omp/agent/models.yml" <<'YML'
          providers:
            demo:
              baseUrl: https://api.example.test/v1
              api: openai-completions
              auth: none
              models:
                - id: demo-1
          YML
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$root/.omp:/home/node/.omp" \
            omp-switch-cli:ci validate --profile default | tee /dev/stderr | grep -q '"ok":true'
          # Help goes to stderr on purpose so stdout stays pure JSON.
          docker run --rm omp-switch-cli:ci --help 2>&1 | grep -q "omp-switch-cli <command>"
          echo "Docker smoke test passed"

  verify-linux:
    name: Verify desktop app on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # build:native is a no-op off Windows, so no .NET/MSVC is needed here.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Electron needs a handful of shared libraries and an X display even for the JSON argv path
      # (Chromium initializes the UI platform layer before app code runs). xvfb provides the
      # display; the runner user cannot chown chrome-sandbox to root:4755, hence --no-sandbox.
      - name: Install Electron runtime libraries and xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2

      - name: Smoke-test the app binary (headless argv dispatch)
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          mkdir -p "$root/home/.omp/agent" "$root/data"
          cat > "$root/home/.omp/agent/models.yml" <<'YML'
          providers:
            demo:
              baseUrl: https://api.example.test/v1
              api: openai-completions
              auth: none
              models:
                - id: demo-1
          YML
          # --no-sandbox: the SUID sandbox helper cannot be configured on CI runners (chrome-sandbox
          # must be root:4755; the runner user cannot chown). Chromium sandboxing is not what this
          # smoke tests — the JSON argv path never opens a window.
          HOME="$root/home" OMP_SWITCH_DATA_DIR="$root/data" \
            xvfb-run -a npx electron out/main/main.js --no-sandbox --json list 2>electron-smoke.err | grep -q '"ok":true' || { cat electron-smoke.err >&2; exit 1; }
          HOME="$root/home" OMP_SWITCH_DATA_DIR="$root/data" \
            xvfb-run -a npx electron out/main/main.js --no-sandbox --json validate --profile default 2>electron-smoke.err | grep -q '"ok":true' || { cat electron-smoke.err >&2; exit 1; }
          echo "Linux headless smoke passed"

  linux-package:
    name: Package and smoke-test Linux artifacts
    runs-on: ubuntu-latest
    # Heavy; keep PRs fast — the verify-linux job already covers the build.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chromium initializes the UI platform layer before app code (see verify-linux).
      - name: Install Electron runtime libraries and xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2
      - name: Package (AppImage + deb)
        run: pnpm package:linux

      - name: Smoke-test the unpacked binary and console shim
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          mkdir -p "$root/home/.omp/agent" "$root/data"
          cat > "$root/home/.omp/agent/models.yml" <<'YML'
          providers:
            demo:
              baseUrl: https://api.example.test/v1
              api: openai-completions
              auth: none
              models:
                - id: demo-1
          YML
          set -x
          ls -la dist/linux-unpacked/ | head -8 >&2
          HOME="$root/home" OMP_SWITCH_DATA_DIR="$root/data" \
            xvfb-run -a "dist/linux-unpacked/omp-switch" --no-sandbox --json list 2>pkg-smoke.err | grep -q '"ok":true' || { cat pkg-smoke.err >&2; exit 1; }
          HOME="$root/home" OMP_SWITCH_DATA_DIR="$root/data" \
            xvfb-run -a dist/linux-unpacked/omp-switch-cli --json list 2>pkg-smoke.err | grep -q '"ok":true' || { cat pkg-smoke.err >&2; exit 1; }
          echo "Unpacked + shim smoke passed"

      - name: Smoke-test the AppImage
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          mkdir -p "$root/home/.omp/agent"
          cat > "$root/home/.omp/agent/models.yml" <<'YML'
          providers:
            demo:
              baseUrl: https://api.example.test/v1
              api: openai-completions
              auth: none
              models:
                - id: demo-1
          YML
          # Extract-then-run: --appimage-extract-and-run pollutes stdout with the file listing,
          # which would break the pure-JSON assertion.
          ./dist/*.AppImage --appimage-extract >/dev/null 2>&1
          HOME="$root/home" timeout 120 xvfb-run -a squashfs-root/AppRun --no-sandbox --json list 2>appimage-smoke.err | grep -q '"ok":true' || { cat appimage-smoke.err >&2; exit 1; }
          rm -rf squashfs-root
          echo "AppImage smoke passed"
