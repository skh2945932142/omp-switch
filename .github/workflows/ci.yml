name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify Windows build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4

      - name: Set up Node.js
        uses: actions/setup-node@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v4
        with:
          node-version: 24

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@ea165f8d65b6e75b540449e92b4886f43607fa02 # v5
        with:
          dotnet-version: 10.0.x

      - name: Enable Corepack
        shell: pwsh
        run: corepack enable

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        shell: pwsh
        run: pnpm typecheck

      - name: Test
        shell: pwsh
        run: pnpm test

      - name: Build
        shell: pwsh
        run: pnpm build

      - name: Ensure builds leave no source changes
        shell: pwsh
        run: |
          $changes = git status --porcelain --untracked-files=all
          if ($changes) {
            $changes
            throw "Build created tracked or unignored files. Update .gitignore or the build process."
          }
