<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101013" />
    <link rel="icon" href="data:," />
    <title>OMP Switch</title>
    <style>
      /* Pre-paint background so a dark OS theme never flashes white before the bundle loads.
         Mirrors the stored manual theme choice before React mounts. */
      html { background: #fafafa; }
      html[data-theme="dark"] { background: #101013; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) { background: #101013; } }
    </style>
    <script>
      try {
        var stored = localStorage.getItem("omp.theme");
        if (stored === "light" || stored === "dark") document.documentElement.dataset.theme = stored;
      } catch (e) { /* private mode */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
